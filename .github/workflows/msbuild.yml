---
name: MSBuild

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, test/adaptive-pacing]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: .  # Path to the solution file relative to the root of the project.
  BUILD_CONFIGURATION: Release  # Configuration type to build.

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Cache the (rarely-changing) third-party build: vcpkg packages + the cmake
    # project dirs. The "Build third party tools" step rebuilds vcpkg deps from
    # source (~21 min) on every cold run; with a warm cache it reconfigures in
    # seconds. The main app is NOT cached, so source changes always recompile.
    - name: Record third-party state (cache key)
      run: git submodule status > submodule-status.txt

    - name: Cache third-party + vcpkg build
      id: cache3p
      uses: actions/cache@v4
      with:
        path: |
          vcpkg_installed
          third_party/moonlight-common-c/build
          libgamestream/build
          ~/AppData/Local/vcpkg/archives
        key: thirdparty-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'submodule-status.txt', 'generate-thirdparty-projects.bat') }}
        restore-keys: |
          thirdparty-${{ runner.os }}-

    - name: Restore VCPKG packages
      if: steps.cache3p.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest `
          -Uri "https://github.com/TheElixZammuto/moonlight-xbox/releases/download/1.10.0/vcpkg_installed.zip" `
          -OutFile .\vcpkg_installed.zip

    - name: Extract VCPKG packages
      if: steps.cache3p.outputs.cache-hit != 'true'
      run: Expand-Archive .\vcpkg_installed.zip -DestinationPath .\ -Force

    - name: List VCPKG packages
      run: dir .\vcpkg_installed

    - name: Install VCPKG packages
      run: .\vcpkg\bootstrap-vcpkg.bat

    - name: Build third party tools
      run: .\generate-thirdparty-projects.bat

    - name: Restore NuGet
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Load Certificate (fork)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CERTIFICATE_FILE: ${{ secrets.CERTIFICATE_FILE }}
      id: cert
      if: >-
        (github.event_name == 'pull_request' &&
            !startsWith(github.event.pull_request.head.repo.full_name, 'TheElixZammuto/')) ||
        (github.event_name == 'workflow_dispatch' &&
            !startsWith(github.repository, 'TheElixZammuto/')) ||
        (github.event_name == 'push' &&
            !startsWith(github.repository, 'TheElixZammuto/'))
      run: |
        if ($env:CERTIFICATE_FILE) {
          # Persistent cert supplied via the CERTIFICATE_FILE repo secret (base64 of a
          # password-less .pfx). Stable thumbprint across builds => trust the .cer on the
          # device ONCE, then every later build installs as an in-place update with no
          # re-trust. The thumbprint is read from the pfx so any supplied cert works.
          Write-Host "Using persistent certificate from CERTIFICATE_FILE secret"
          $encodedBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_FILE)
          Set-Content "cert.pfx" -Value $encodedBytes -AsByteStream

          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("cert.pfx", "")
          "password=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "thumbprint=$($pfx.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-FileHash -Path "cert.pfx"
        }
        else {
          # Fallback: ephemeral self-signed certificate (new thumbprint each build, so the
          # .cer must be re-trusted on the device every time). Used when no secret is set.
          # https://learn.microsoft.com/en-us/windows/msix/package/create-certificate-package-signing#use-new-selfsignedcertificate-to-create-a-certificate
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=CE07B73A-712E-4E05-932B-D08CE2C8A87C" `
            -KeyUsage DigitalSignature `
            -FriendlyName "MoonlightUWP" `
            -CertStoreLocation "Cert:\LocalMachine\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          # Use the GITHUB_TOKEN to create a password for the certificate
          # The token expires when the workflow ends OR after a maximum of 24 hours
          # GITHUB_TOKENS from forks have very limited permissions, which is basically read-only
          $githubToken = $env:GH_TOKEN
          $md5 = New-Object -TypeName System.Security.Cryptography.MD5CryptoServiceProvider
          $hashBytes = $md5.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($githubToken))
          $hash = [System.BitConverter]::ToString($hashBytes).Replace("-", "").ToLower()
          $password = ConvertTo-SecureString -String $hash -Force -AsPlainText

          # export the password for later use, decoded
          "password=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # export the self-signed cert thumbprint so the Build step can override
          # the thumbprint pinned in the vcxproj (which targets the maintainer's
          # real cert) and sign with this cert instead
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Export-PfxCertificate `
            -Cert Cert:\LocalMachine\My\$($cert.Thumbprint) `
            -FilePath cert.pfx `
            -Password (ConvertTo-SecureString -String $hash -AsPlainText -Force)
          Get-FileHash -Path "cert.pfx"
        }

        # # Add the certificate to the local machine store
        # $cert_guid = [guid]::NewGuid()
        # netsh http add sslcert `
        #   ipport=0.0.0.0:443 `
        #   certhash=$($cert.Thumbprint.ToString()) `
        #   appid=$($cert_guid.ToString('B'))

    - name: Load Certificate (local)
      if: >-
        (startsWith(github.event.pull_request.head.repo.full_name, 'TheElixZammuto/') &&
            github.event_name == 'pull_request') ||
        (startsWith(github.repository, 'TheElixZammuto/') &&
            github.event_name == 'push')
      env:
        CERTIFICATE_FILE: ${{ secrets.CERTIFICATE_FILE }}
      run: |
        $encodedBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_FILE)
        Set-Content "cert.pfx" -Value $encodedBytes -AsByteStream
        Get-FileHash -Path "cert.pfx"

    - name: Bump package revision (fork test builds)
      # Set the manifest version's 4th field to the run number so each fork build is a
      # higher version than the last -> Device Portal treats it as an in-place update
      # instead of a same-version reinstall. Keeps the first three version fields as-is.
      if: >-
        (github.event_name == 'pull_request' &&
            !startsWith(github.event.pull_request.head.repo.full_name, 'TheElixZammuto/')) ||
        ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
            !startsWith(github.repository, 'TheElixZammuto/'))
      run: |
        $rev = "${{ github.run_number }}"
        $manifest = "Package.appxmanifest"
        $content = Get-Content $manifest -Raw
        $content = $content -replace '(<Identity[\s\S]*?Version=")([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+(")', "`${1}`${2}.$rev`${3}"
        Set-Content $manifest -Value $content -NoNewline
        if ($content -match '<Identity[\s\S]*?Version="([0-9.]+)"') { Write-Host "Package version set to $($Matches[1])" }

    - name: Build
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        # get the password from the output if this is a fork
        $certPassword = "${{ steps.cert.outputs.password }}"

        # if certPassword is not empty, use it
        if ($certPassword -ne "") {
          $certPasswordArg = "/p:PackageCertificatePassword=$certPassword"
        }
        else {
          $certPasswordArg = ""
        }

        # for a self-signed fork build, override the thumbprint pinned in the
        # vcxproj (which targets the maintainer's real cert) so it matches the
        # cert we just generated; empty on the upstream path leaves it untouched
        $certThumb = "${{ steps.cert.outputs.thumbprint }}"
        if ($certThumb -ne "") {
          $certThumbArg = "/p:PackageCertificateThumbprint=$certThumb"
        }
        else {
          $certThumbArg = ""
        }

        msbuild /m `
          /p:Configuration=${{env.BUILD_CONFIGURATION}} `
          /p:AppxBundle=Always `
          /p:AppxPackageDir=output `
          /p:PackageCertificateKeyFile=cert.pfx `
          /p:UapAppxPackageBuildMode=SideLoadOnly `
          $certPasswordArg `
          $certThumbArg `
          ${{env.SOLUTION_FILE_PATH}}

    - name: Clean Certificate
      if: always()  # clean up, even if build fails
      run: |
        if(test-path cert.pfx){
          Remove-Item -path cert.pfx
        }
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-uwp
        path: |
          output
